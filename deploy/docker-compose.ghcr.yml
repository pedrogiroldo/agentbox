# Deploy the prebuilt image — no build step on your server.
#
# This is the file to paste into Coolify / Dokploy / Portainer when you do not
# want them compiling the image on a small VPS. See docs/deploy.md.
name: agentbox

services:
  agentbox:
    image: ghcr.io/pedrogiroldo/agentbox:latest
    container_name: agentbox
    hostname: agentbox
    restart: unless-stopped
    # Stopping your containers, then saving the system layer.
    stop_grace_period: 90s

    # The box runs its own Docker daemon (installed on the first boot), and a
    # daemon needs this to run anything. It also makes the box as trusted as
    # the host — docs/security.md. Drop it and set AGENTBOX_DOCKER=off for a
    # box that cannot reach the host; everything else still works.
    privileged: true

    ports:
      - "2222:22"

    environment:
      # REQUIRED — the public key you will SSH with (laptop and/or phone).
      SSH_PUBLIC_KEY: "ssh-ed25519 AAAA... you@laptop"
      GIT_USER_NAME: "Your Name"
      GIT_USER_EMAIL: "you@example.com"
      TZ: "UTC"
      LANG: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"
      # install (default): the first boot fetches the Docker engine, and the
      # state volume keeps it from then on. off: no daemon, no download.
      AGENTBOX_DOCKER: "install"

    volumes:
      - agentbox-home:/home/dev
      # apt packages and edits outside the home, replayed on every boot.
      # Deleting both volumes is what "start over" means.
      - agentbox-state:/var/lib/agentbox
      # Docker's images and containers, kept across a recreate.
      - agentbox-docker:/var/lib/docker
      # Borrow the host's daemon instead of running one here — docs/docker.md.
      # - /var/run/docker.sock:/var/run/docker.sock

volumes:
  agentbox-home:
  agentbox-state:
  agentbox-docker:
