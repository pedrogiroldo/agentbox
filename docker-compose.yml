name: agentbox

services:
  agentbox:
    # Build from this repository. To use the prebuilt image instead, comment
    # out the `build:` block and set AGENTBOX_IMAGE in your .env.
    build:
      context: .
      args:
        NODE_VERSION: ${NODE_VERSION:-24.13.0}
        NVIM_VERSION: ${NVIM_VERSION:-stable}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        CODEX_VERSION: ${CODEX_VERSION:-latest}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-latest}
        INSTALL_DOCKER_CLI: ${INSTALL_DOCKER_CLI:-true}
        # Bake the Docker daemon into the image (+192 MB). Off, because the box
        # installs it on first boot into the state volume instead — same
        # result, smaller image. docs/docker.md has the trade.
        INSTALL_DOCKER_ENGINE: ${INSTALL_DOCKER_ENGINE:-false}
        PREINSTALL_NVIM_PLUGINS: ${PREINSTALL_NVIM_PLUGINS:-true}
    image: ${AGENTBOX_IMAGE:-agentbox:local}
    container_name: ${AGENTBOX_NAME:-agentbox}
    hostname: ${AGENTBOX_HOSTNAME:-agentbox}
    restart: unless-stopped
    # On the way out the box stops your containers, then saves its system
    # layer. Both need time; this is the budget for the two of them.
    stop_grace_period: ${AGENTBOX_STOP_GRACE:-90s}

    ports:
      # host:container — connect with `ssh -p 2222 dev@<host>`
      - "${SSH_PORT:-2222}:22"
      # mosh survives a phone changing networks, but needs UDP. Most managed
      # proxies (Coolify/Dokploy) do not forward UDP; enable only if yours does.
      # - "${MOSH_PORT_RANGE:-60000-60010}:60000-60010/udp"

    environment:
      # --- access ---
      SSH_PUBLIC_KEY: ${SSH_PUBLIC_KEY:-}
      AGENTBOX_PASSWORD: ${AGENTBOX_PASSWORD:-}
      # --- mirroring ---
      # What a client *outside* dials to reach this box. The container cannot
      # know it — the port mapping and any proxy live out here — so
      # agentbox-mirror prints a placeholder until you fill this in.
      AGENTBOX_SSH_HOST: ${AGENTBOX_SSH_HOST:-}
      # The published port, not the container's 22: it is what gets dialed.
      AGENTBOX_SSH_PORT: ${AGENTBOX_SSH_PORT:-${SSH_PORT:-2222}}
      # --- identity ---
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      # --- locale ---
      TZ: ${TZ:-UTC}
      LANG: ${AGENTBOX_LANG:-en_US.UTF-8}
      LC_ALL: ${AGENTBOX_LANG:-en_US.UTF-8}
      # --- behaviour ---
      # Where the agentbox wordmark shows up: always (default) | login | off
      AGENTBOX_BANNER: ${AGENTBOX_BANNER:-always}
      AGENTBOX_BANNER_BY: ${AGENTBOX_BANNER_BY:-}
      AGENTBOX_HERDR_INTEGRATIONS: ${AGENTBOX_HERDR_INTEGRATIONS:-1}
      # The daemon inside: install (get it on first boot, then run it), auto
      # (run it only if something already installed it), on (a box without
      # Docker refuses to boot), off (never).
      AGENTBOX_DOCKER: ${AGENTBOX_DOCKER:-install}
      # --- persistence beyond the home ---
      # apt installs and edits to /usr/local, /opt and /etc are recorded and
      # replayed on boot. 0 turns that off (only /home/dev survives then).
      AGENTBOX_PERSIST: ${AGENTBOX_PERSIST:-1}
      # Seconds between automatic saves; a graceful stop always saves too.
      AGENTBOX_PERSIST_INTERVAL: ${AGENTBOX_PERSIST_INTERVAL:-300}
      # Set to "force" once to restore the config files shipped in the image.
      AGENTBOX_RESEED: ${AGENTBOX_RESEED:-}
      # Only needed when /home/dev is a bind mount and uids must match the host.
      PUID: ${PUID:-}
      PGID: ${PGID:-}

    volumes:
      # Everything you care about lives here: repos, agent credentials, shell
      # history, Neovim state, herdr sessions, SSH host keys.
      - agentbox-home:/home/dev
      # The system layer: your apt packages (list + .deb cache) and the files
      # you changed outside the home. Wipe both volumes for a fresh start.
      - agentbox-state:/var/lib/agentbox
      # The box's own Docker images and containers. Without this they land on
      # the container filesystem, where overlay cannot stack: Docker drops to
      # the vfs driver (slow, and it eats disk) and everything is gone on the
      # next recreate.
      - agentbox-docker:/var/lib/docker
      # Instead of running its own, the box can borrow the host's daemon —
      # mount this and the one inside steps aside. See docs/docker.md.
      # - /var/run/docker.sock:/var/run/docker.sock

    # What the daemon inside needs: a container may not create namespaces,
    # mount filesystems or write cgroups without it, and there is no smaller
    # capability set that works. It also makes the box as trusted as the host
    # it runs on (docs/security.md). For a box that cannot reach the host,
    # drop this line and set AGENTBOX_DOCKER=off above.
    privileged: true

    # Agents spawn a lot of short-lived processes; give the box room to breathe.
    # Uncomment and tune for your server.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "4"
    #       memory: 8g

volumes:
  agentbox-home:
    name: ${AGENTBOX_VOLUME:-agentbox-home}
  agentbox-state:
    name: ${AGENTBOX_STATE_VOLUME:-agentbox-state}
  # Docker's own data: images, containers, its volumes. Big, and rebuildable —
  # this is the one of the three you can delete without losing your work.
  agentbox-docker:
    name: ${AGENTBOX_DOCKER_VOLUME:-agentbox-docker}
